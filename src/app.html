<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fde68a" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

    <!-- Link previews. Crawlers do not resolve relative URLs, so og:image is absolute
         against the production origin rather than %sveltekit.assets%. Per-page titles
         come from each route's <svelte:head>; these are the site-wide fallbacks. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Robaca: Belajar Membaca" />
    <meta property="og:title" content="Robaca: Belajar Membaca" />
    <meta
      property="og:description"
      content="Belajar membaca Bahasa Indonesia untuk anak PAUD & TK, ditemani robot Robaca."
    />
    <meta property="og:url" content="https://belajar-membaca.gj.lc/" />
    <meta property="og:image" content="https://belajar-membaca.gj.lc/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Robot Robaca dengan huruf A B C" />
    <meta property="og:locale" content="id_ID" />
    <meta name="twitter:card" content="summary_large_image" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-amber-50 text-slate-800">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
