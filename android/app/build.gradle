apply plugin: 'com.android.application'

// Single source of truth for the app version is package.json, which release-please bumps.
// versionCode is derived so it always increases: 1.7.1 -> 10701.
//
// Play rejects a bundle whose versionCode was already used, so the encoding must stay
// collision-free: minor/patch are bounded to two digits each, otherwise 1.100.0 and 2.0.0
// would both encode to 20000. Fail the build rather than ship a duplicate.
def appVersion = new groovy.json.JsonSlurper().parseText(file("../../package.json").text).version
def verMatch = (appVersion =~ /^(\d+)\.(\d+)\.(\d+)$/)
if (!verMatch.matches()) {
    throw new GradleException(
        "package.json version '${appVersion}' is not a plain MAJOR.MINOR.PATCH release; " +
        "prerelease/build-metadata versions have no defined versionCode encoding.")
}
def (verMajor, verMinor, verPatch) =
    [verMatch[0][1], verMatch[0][2], verMatch[0][3]].collect { it.toInteger() }
if (verMinor > 99 || verPatch > 99) {
    throw new GradleException(
        "version '${appVersion}' overflows the versionCode encoding (minor/patch must be <= 99).")
}

android {
    namespace "com.yaskur.belajarmembaca"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.yaskur.belajarmembaca"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode verMajor * 10000 + verMinor * 100 + verPatch
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Populated from CI secrets (see .github/workflows/android.yml). With no keystore in
    // the environment the release build still runs, it just produces an unsigned bundle.
    signingConfigs {
        release {
            def keystore = System.getenv("ANDROID_KEYSTORE_FILE")
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
